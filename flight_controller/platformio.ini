;=============================================================================
; dRehmFlight VTOL PlatformIO Configuration - FIXED
;=============================================================================

[platformio]
default_envs = teensy40

;=============================================================================
; Common settings for all environments
;=============================================================================
[env]
framework = arduino
monitor_speed = 115200
upload_protocol = teensy-gui

; Library dependencies (common to all boards)
lib_deps = 
    Wire
    SPI
    
; Build flags (common to all boards)
; CRITICAL FIX: Add -I include so lib/ files can find config.h
build_flags = 
    -D USB_SERIAL
    -D LAYOUT_US_ENGLISH
    -I include
    -Wno-unknown-pragmas

;=============================================================================
; Teensy 4.0 Environment (RECOMMENDED - Most common)
;=============================================================================
[env:teensy40]
platform = teensy
board = teensy40
; FIXED: Removed incorrect __MK66FX1M0__ (that's for Teensy 3.6!)
build_flags = 
    ${env.build_flags}
    -D ARDUINO_TEENSY40
    -D __IMXRT1062__
    ; Optimize for speed
    -O2
    -mcpu=cortex-m7
    -mfloat-abi=hard
    -mfpu=fpv5-d16
    ; Suppress Wire library Teensy 3.x file compilation
    -Wno-unused-variable

;=============================================================================
; Teensy 4.1 Environment
;=============================================================================
[env:teensy41]
platform = teensy
board = teensy41
build_flags = 
    ${env.build_flags}
    -D ARDUINO_TEENSY41
    -D __IMXRT1062__
    -O2
    -mcpu=cortex-m7
    -mfloat-abi=hard
    -mfpu=fpv5-d16

;=============================================================================
; Teensy 3.6 Environment (Legacy support)
;=============================================================================
[env:teensy36]
platform = teensy
board = teensy36
build_flags =
    ${env.build_flags}
    -D ARDUINO_TEENSY36
    -D __MK66FX1M0__
    -O2

;=============================================================================
; CALIBRATION BUILD ENVIRONMENTS
;=============================================================================
; These extend the board environments and add -D CALIBRATION_MODE.
; Calibration builds include all calibration routines, CH6 switch triggers,
; and debug output. Live builds (default) compile these out.
;
; Usage:
;   pio run -e teensy40                  # live build (default, lean)
;   pio run -e teensy40_calibration      # calibration build
;   pio run -e teensy40_calibration --target upload   # flash calibration firmware

[env:teensy40_calibration]
extends = env:teensy40
lib_deps =
    ${env.lib_deps}
    Calibration
build_flags =
    ${env:teensy40.build_flags}
    -D CALIBRATION_MODE

[env:teensy41_calibration]
extends = env:teensy41
lib_deps =
    ${env.lib_deps}
    Calibration
build_flags =
    ${env:teensy41.build_flags}
    -D CALIBRATION_MODE

[env:teensy36_calibration]
extends = env:teensy36
lib_deps =
    ${env.lib_deps}
    Calibration
build_flags =
    ${env:teensy36.build_flags}
    -D CALIBRATION_MODE

;=============================================================================
; ESP32 ENVIRONMENTS (WiFi-enabled flight controller)
;=============================================================================
; ESP32 provides built-in WiFi for wireless configuration and telemetry.
; Uses dual-core: Core 0 for flight control, Core 1 for WiFi/comms.
;
; Usage:
;   pio run -e esp32                    # live build
;   pio run -e esp32_calibration        # calibration build
;   pio run -e esp32s3                  # ESP32-S3 variant (USB native)

[env:esp32_base]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_protocol = esptool  ; Override Teensy protocol
; Common ESP32 build flags
build_flags =
    -D USE_ESP32
    -I include
    -Wno-unknown-pragmas
    ; FreeRTOS configuration
    -D CONFIG_FREERTOS_HZ=1000
    ; Optimize for speed
    -O2
lib_deps =
    Wire
    SPI

[env:esp32]
extends = env:esp32_base
board = esp32dev
build_flags =
    ${env:esp32_base.build_flags}
    -D ARDUINO_ESP32_DEV
    ; Target 1kHz loop rate (sufficient for research drones)
    -D LOOP_FREQUENCY_HZ=1000

[env:esp32_calibration]
extends = env:esp32
lib_deps =
    ${env:esp32_base.lib_deps}
    Calibration
build_flags =
    ${env:esp32.build_flags}
    -D CALIBRATION_MODE

[env:esp32s3]
extends = env:esp32_base
board = esp32-s3-devkitc-1
build_flags =
    ${env:esp32_base.build_flags}
    -D ARDUINO_ESP32S3_DEV
    -D USE_ESP32S3
    -D LOOP_FREQUENCY_HZ=1000

[env:esp32s3_calibration]
extends = env:esp32s3
lib_deps =
    ${env:esp32_base.lib_deps}
    Calibration
build_flags =
    ${env:esp32s3.build_flags}
    -D CALIBRATION_MODE