;=============================================================================
; dRehmFlight VTOL PlatformIO Configuration - FIXED
;=============================================================================

[platformio]
default_envs = teensy40

;=============================================================================
; Common settings for all environments
;=============================================================================
[env]
framework = arduino
monitor_speed = 115200
upload_protocol = teensy-gui

; Library dependencies (common to all boards)
lib_deps = 
    Wire
    SPI
    
; Build flags (common to all boards)
; CRITICAL FIX: Add -I include so lib/ files can find config.h
build_flags = 
    -D USB_SERIAL
    -D LAYOUT_US_ENGLISH
    -I include
    -Wno-unknown-pragmas

;=============================================================================
; Teensy 4.0 Environment (RECOMMENDED - Most common)
;=============================================================================
[env:teensy40]
platform = teensy
board = teensy40
; FIXED: Removed incorrect __MK66FX1M0__ (that's for Teensy 3.6!)
build_flags = 
    ${env.build_flags}
    -D ARDUINO_TEENSY40
    -D __IMXRT1062__
    ; Optimize for speed
    -O2
    -mcpu=cortex-m7
    -mfloat-abi=hard
    -mfpu=fpv5-d16
    ; Suppress Wire library Teensy 3.x file compilation
    -Wno-unused-variable

;=============================================================================
; Teensy 4.1 Environment
;=============================================================================
[env:teensy41]
platform = teensy
board = teensy41
build_flags = 
    ${env.build_flags}
    -D ARDUINO_TEENSY41
    -D __IMXRT1062__
    -O2
    -mcpu=cortex-m7
    -mfloat-abi=hard
    -mfpu=fpv5-d16

;=============================================================================
; Teensy 3.6 Environment (Legacy support)
;=============================================================================
[env:teensy36]
platform = teensy
board = teensy36
build_flags = 
    ${env.build_flags}
    -D ARDUINO_TEENSY36
    -D __MK66FX1M0__
    -O2