;=============================================================================
; dRehmFlight VTOL PlatformIO Configuration
;=============================================================================

[platformio]
default_envs = teensy40

;=============================================================================
; Common settings for all environments
;=============================================================================
[env]
framework = arduino
monitor_speed = 115200
upload_protocol = teensy-gui

; All libraries are vendored in lib/ — no external downloads needed.
; Wire and SPI are Arduino framework built-ins.
; U8g2, ArduinoJson, AsyncTCP, ESPAsyncWebServer are in lib/ (auto-discovered).
lib_deps =
    Wire
    SPI

; Build flags (common to all boards)
build_flags =
    -D USB_SERIAL
    -D LAYOUT_US_ENGLISH
    -I include
    -Wno-unknown-pragmas

;=============================================================================
; Teensy 4.0 Environment (RECOMMENDED - Most common)
;=============================================================================
[env:teensy40]
platform = teensy
board = teensy40
build_flags =
    ${env.build_flags}
    -D ARDUINO_TEENSY40
    -D __IMXRT1062__
    -O2
    -mcpu=cortex-m7
    -mfloat-abi=hard
    -mfpu=fpv5-d16
    -Wno-unused-variable

;=============================================================================
; Teensy 4.1 Environment
;=============================================================================
[env:teensy41]
platform = teensy
board = teensy41
build_flags =
    ${env.build_flags}
    -D ARDUINO_TEENSY41
    -D __IMXRT1062__
    -O2
    -mcpu=cortex-m7
    -mfloat-abi=hard
    -mfpu=fpv5-d16

;=============================================================================
; Teensy 3.6 Environment (Legacy support)
;=============================================================================
[env:teensy36]
platform = teensy
board = teensy36
build_flags =
    ${env.build_flags}
    -D ARDUINO_TEENSY36
    -D __MK66FX1M0__
    -O2

;=============================================================================
; CALIBRATION BUILD ENVIRONMENTS
;=============================================================================
; These extend the board environments and add calibration + display support.
; Calibration builds include: calibration routines, CH6 triggers, debug output, OLED display.
;
; Usage:
;   pio run -e teensy40                  # live build (default, lean)
;   pio run -e teensy40_calibration      # calibration build with OLED display
;   pio run -e teensy40_calibration --target upload

[env:teensy40_calibration]
extends = env:teensy40
lib_deps =
    ${env.lib_deps}
    Calibration
build_flags =
    ${env:teensy40.build_flags}
    -D CALIBRATION_MODE
    -D USE_OLED_DISPLAY

[env:teensy41_calibration]
extends = env:teensy41
lib_deps =
    ${env.lib_deps}
    Calibration
build_flags =
    ${env:teensy41.build_flags}
    -D CALIBRATION_MODE
    -D USE_OLED_DISPLAY

[env:teensy36_calibration]
extends = env:teensy36
lib_deps =
    ${env.lib_deps}
    Calibration
build_flags =
    ${env:teensy36.build_flags}
    -D CALIBRATION_MODE
    -D USE_OLED_DISPLAY

;=============================================================================
; ESP32 ENVIRONMENTS (WiFi-enabled flight controller)
;=============================================================================
; ESP32 provides built-in WiFi for wireless configuration and telemetry.
; Dual-core: Core 0 for flight control, Core 1 for WiFi/display/comms.
; OLED display and WiFi STA mode enabled by default on all ESP32 builds.
;
; Usage:
;   pio run -e esp32                    # live build (with WiFi + display)
;   pio run -e esp32_calibration        # calibration build
;   pio run -e esp32s3                  # ESP32-S3 variant (USB native)

[env:esp32_base]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
; ESP32-only libraries (AsyncTCP, ESPAsyncWebServer) live in lib_esp32/
lib_extra_dirs = lib_esp32
; Ignore cross-platform deps that ESPAsyncWebServer declares for non-ESP32 platforms
lib_ignore = RPAsyncTCP, ESPAsyncTCP
build_flags =
    -D USE_ESP32
    -I include
    -Wno-unknown-pragmas
    -D CONFIG_FREERTOS_HZ=1000
    -O2
    ; Display and WiFi enabled by default on ESP32
    -D USE_OLED_DISPLAY
    -D USE_WIFI
    ; Pin AsyncTCP to Core 1 (same as WiFi/display, away from flight control on Core 0)
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
; All libraries vendored in lib/ — no external downloads needed.
lib_deps =
    Wire
    SPI

[env:esp32]
extends = env:esp32_base
board = esp32dev
build_flags =
    ${env:esp32_base.build_flags}
    -D ARDUINO_ESP32_DEV
    -D LOOP_FREQUENCY_HZ=1000

[env:esp32_calibration]
extends = env:esp32
lib_deps =
    ${env.lib_deps}
    Calibration
build_flags =
    ${env:esp32.build_flags}
    -D CALIBRATION_MODE

[env:esp32s3]
extends = env:esp32_base
board = esp32-s3-devkitc-1
build_flags =
    ${env:esp32_base.build_flags}
    -D ARDUINO_ESP32S3_DEV
    -D USE_ESP32S3
    -D LOOP_FREQUENCY_HZ=1000

[env:esp32s3_calibration]
extends = env:esp32s3
lib_deps =
    ${env.lib_deps}
    Calibration
build_flags =
    ${env:esp32s3.build_flags}
    -D CALIBRATION_MODE
