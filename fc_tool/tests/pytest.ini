[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Pure Python tests, no external dependencies (fast, <2s total)
    integration: Tests using simulate_serial.py (Python-only, no binary)
    e2e: End-to-end tests requiring fc_tool binary + socat (slow)
    performance: Throughput benchmarks (slow, optional)
    edge_case: Boundary conditions and malformed data
    slow: Long-running tests (>10s, opt-in)

# Default: show short tracebacks, verbose test names
addopts = -v --tb=short
