<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fc_tool</title>
    <script src="/lib/chart.min.js"></script>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>fc_tool</h1>
      <p class="subtitle">floppi Flight Controller Tool</p>

      <section id="serial-section">
        <h2>Connection</h2>
        <div class="connection-controls">
          <div class="control-row">
            <label for="port-select">Port:</label>
            <select id="port-select" disabled>
              <option value="">-- Scan for ports --</option>
            </select>
            <button id="scan-btn" type="button">Scan</button>
          </div>
          <div class="control-row">
            <label for="baud-select">Baud:</label>
            <select id="baud-select">
              <option value="9600">9600</option>
              <option value="19200">19200</option>
              <option value="38400">38400</option>
              <option value="57600">57600</option>
              <option value="115200" selected>115200</option>
              <option value="230400">230400</option>
              <option value="460800">460800</option>
              <option value="921600">921600</option>
            </select>
            <button id="connect-btn" type="button" disabled>Connect</button>
          </div>
        </div>
        <div id="connection-status" class="status-disconnected">Disconnected</div>
      </section>

      <section id="monitor-section">
        <div class="section-header">
          <h2>Serial Monitor</h2>
          <button id="plotter-toggle-btn" type="button">Show Plotter</button>
        </div>
        <div id="terminal-container">
          <div id="terminal-output"></div>
          <div class="terminal-input-row">
            <input type="text" id="terminal-input" placeholder="Enter command..." disabled />
            <button id="send-btn" type="button" disabled>Send</button>
            <label class="checkbox-label">
              <input type="checkbox" id="newline-checkbox" checked />
              +LF
            </label>
          </div>
        </div>
        <div class="terminal-controls">
          <button id="clear-monitor-btn" type="button">Clear</button>
          <button id="copy-monitor-btn" type="button">Copy All</button>
          <input type="text" id="filter-input" placeholder="Filter..." />
          <label class="checkbox-label">
            <input type="checkbox" id="autoscroll-checkbox" checked />
            Auto-scroll
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="ansi-checkbox" checked />
            ANSI
          </label>
        </div>
      </section>

      <section id="plotter-section" style="display: none;">
        <div class="section-header">
          <h2>Serial Plotter</h2>
          <div class="plotter-controls">
            <label class="plotter-label" title="Number of data points visible per plot">
              Window:
              <input type="number" id="plotter-window-input" value="200" min="50" max="5000" step="50" />
            </label>
            <button id="plotter-pause-btn" type="button" title="Pause/Resume">&#x23F8;</button>
            <button id="plotter-clear-btn" type="button" title="Clear all plots">Clear</button>
          </div>
        </div>
        <div id="plotter-container"></div>
        <div class="plotter-status">
          <span id="plotter-status-text">Waiting for data...</span>
        </div>
      </section>
    </main>
  </body>
</html>
