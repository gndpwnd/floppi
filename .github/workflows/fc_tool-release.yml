name: fc_tool Release Build

# Manual trigger only — never runs automatically.
# Go to Actions > fc_tool Release Build > Run workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.1.0)"
        required: true
        type: string
      create_release:
        description: "Create a GitHub Release with the built binaries"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: linux
          - platform: windows-latest
            target: windows
          - platform: macos-latest
            target: macos

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: fc_tool

    steps:
      - uses: actions/checkout@v4

      # ── System dependencies ────────────────────────────────────

      - name: Install system dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libudev-dev \
            xdg-utils

      - name: Install system dependencies (macOS)
        if: matrix.target == 'macos'
        run: |
          # Xcode command line tools are pre-installed on GitHub runners.
          # Tauri on macOS uses WKWebView (built into macOS), no extra libs needed.
          echo "macOS: no additional system packages required"

      # Windows: WebView2 is pre-installed on Windows 10/11 and GitHub runners.
      # MSVC build tools come with the runner image.

      # ── Toolchains ─────────────────────────────────────────────

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fc_tool/src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install

      - name: Install Tauri CLI
        run: npm install @tauri-apps/cli@latest

      # ── Build ──────────────────────────────────────────────────

      - name: Build release
        run: npx tauri build

      # ── Upload artifacts ───────────────────────────────────────

      - name: Upload Linux artifacts
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: fc_tool-linux
          path: |
            fc_tool/src-tauri/target/release/bundle/deb/*.deb
            fc_tool/src-tauri/target/release/bundle/rpm/*.rpm
            fc_tool/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload Windows artifacts
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: fc_tool-windows
          path: |
            fc_tool/src-tauri/target/release/bundle/msi/*.msi
            fc_tool/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS artifacts
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: fc_tool-macos
          path: |
            fc_tool/src-tauri/target/release/bundle/dmg/*.dmg
            fc_tool/src-tauri/target/release/bundle/macos/*.app

  # ── Release ──────────────────────────────────────────────────

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.create_release }}

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: "fc_tool ${{ inputs.version }}"
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/fc_tool-linux/**/*
            artifacts/fc_tool-windows/**/*
            artifacts/fc_tool-macos/**/*
