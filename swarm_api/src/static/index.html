<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floppi Swarm Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; }

        .header { background: #16213e; padding: 12px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 2px solid #0f3460; }
        .header h1 { font-size: 1.3rem; color: #e94560; }
        .header .status { font-size: 0.85rem; color: #888; }

        .container { display: flex; height: calc(100vh - 52px); }

        /* Fleet panel */
        .fleet-panel { width: 280px; background: #16213e; border-right: 1px solid #0f3460; overflow-y: auto; flex-shrink: 0; }
        .fleet-panel h2 { padding: 12px 16px; font-size: 0.9rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .drone-card { padding: 12px 16px; border-bottom: 1px solid #0f3460; cursor: pointer; transition: background 0.15s; }
        .drone-card:hover { background: #1a1a3e; }
        .drone-card.selected { background: #0f3460; border-left: 3px solid #e94560; }
        .drone-card .name { font-weight: 600; font-size: 0.95rem; }
        .drone-card .meta { font-size: 0.8rem; color: #888; margin-top: 4px; }
        .drone-card .indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .indicator.online { background: #4ecca3; }
        .indicator.offline { background: #e94560; }

        /* Main area */
        .main-area { flex: 1; padding: 24px; overflow-y: auto; }
        .no-selection { display: flex; align-items: center; justify-content: center; height: 100%; color: #555; font-size: 1.1rem; }

        /* Telemetry grid */
        .telem-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .telem-card { background: #16213e; border-radius: 8px; padding: 16px; border: 1px solid #0f3460; }
        .telem-card .label { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .telem-card .value { font-size: 1.5rem; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
        .telem-card .unit { font-size: 0.8rem; color: #666; }

        /* Controls */
        .controls-section { background: #16213e; border-radius: 8px; padding: 20px; border: 1px solid #0f3460; }
        .controls-section h3 { margin-bottom: 16px; font-size: 0.9rem; color: #888; text-transform: uppercase; }
        .slider-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .slider-row label { width: 80px; font-size: 0.85rem; }
        .slider-row input[type="range"] { flex: 1; accent-color: #e94560; }
        .slider-row .val { width: 50px; text-align: right; font-variant-numeric: tabular-nums; font-size: 0.9rem; }

        .btn-row { display: flex; gap: 12px; margin-top: 16px; }
        .btn { padding: 10px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: opacity 0.15s; }
        .btn:hover { opacity: 0.85; }
        .btn-arm { background: #e94560; color: white; }
        .btn-disarm { background: #4ecca3; color: #1a1a2e; }
        .btn-stop { background: #888; color: white; }

        .warning { background: #e9456020; border: 1px solid #e94560; border-radius: 6px; padding: 10px 16px; margin-bottom: 16px; font-size: 0.85rem; color: #e94560; }

        /* Auth controls */
        .auth-box { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .auth-box input { background: #0f3460; border: 1px solid #1a1a3e; color: #e0e0e0; border-radius: 4px; padding: 6px 10px; font-size: 0.8rem; width: 160px; }
        .auth-box input::placeholder { color: #6a7a9a; }
        .auth-box button { background: #0f3460; color: #e0e0e0; border: 1px solid #1a1a3e; border-radius: 4px; padding: 6px 12px; font-size: 0.8rem; cursor: pointer; }
        .auth-box button:hover { background: #1a1a3e; }
        .auth-indicator { font-size: 0.75rem; color: #888; }
        .auth-indicator.set { color: #4ecca3; }
        .auth-banner { display: none; background: #e9456020; border: 1px solid #e94560; color: #e94560; padding: 10px 24px; font-size: 0.9rem; }
        .auth-banner.show { display: block; }
    </style>
</head>
<body>
    <div class="header">
        <h1>FLOPPI SWARM</h1>
        <span class="status" id="connStatus">Connecting...</span>
        <div class="auth-box">
            <span class="auth-indicator" id="authIndicator">No token</span>
            <input type="password" id="authTokenInput" placeholder="Auth token (if enabled)" autocomplete="off">
            <button id="authSaveBtn" onclick="saveToken()">Save</button>
            <button id="authClearBtn" onclick="clearToken()">Clear</button>
        </div>
    </div>

    <div class="auth-banner" id="authBanner"></div>

    <div class="container">
        <div class="fleet-panel">
            <h2>Fleet</h2>
            <div id="fleetList"></div>
        </div>

        <div class="main-area" id="mainArea">
            <div class="no-selection" id="noSelection">Select a drone from the fleet panel</div>

            <div id="droneView" style="display:none;">
                <div class="warning">Commands are live. Ensure props are removed for ground testing.</div>

                <div class="telem-grid">
                    <div class="telem-card">
                        <div class="label">Roll</div>
                        <div class="value" id="tRoll">--</div>
                        <div class="unit">degrees</div>
                    </div>
                    <div class="telem-card">
                        <div class="label">Pitch</div>
                        <div class="value" id="tPitch">--</div>
                        <div class="unit">degrees</div>
                    </div>
                    <div class="telem-card">
                        <div class="label">Yaw</div>
                        <div class="value" id="tYaw">--</div>
                        <div class="unit">degrees</div>
                    </div>
                    <div class="telem-card">
                        <div class="label">Armed</div>
                        <div class="value" id="tArmed">--</div>
                    </div>
                    <div class="telem-card">
                        <div class="label">Loop Time</div>
                        <div class="value" id="tLoop">--</div>
                        <div class="unit">us</div>
                    </div>
                    <div class="telem-card">
                        <div class="label">RSSI</div>
                        <div class="value" id="tRssi">--</div>
                        <div class="unit">dBm</div>
                    </div>
                    <div class="telem-card">
                        <div class="label">Motors</div>
                        <div class="value" id="tMotors" style="font-size:1rem;">--</div>
                    </div>
                    <div class="telem-card">
                        <div class="label">Latency</div>
                        <div class="value" id="tLatency">--</div>
                        <div class="unit">ms</div>
                    </div>
                </div>

                <div class="controls-section">
                    <h3>Manual Control</h3>
                    <div class="slider-row">
                        <label>Throttle</label>
                        <input type="range" id="slThrottle" min="1000" max="2000" value="1000">
                        <span class="val" id="valThrottle">1000</span>
                    </div>
                    <div class="slider-row">
                        <label>Roll</label>
                        <input type="range" id="slRoll" min="1000" max="2000" value="1500">
                        <span class="val" id="valRoll">1500</span>
                    </div>
                    <div class="slider-row">
                        <label>Pitch</label>
                        <input type="range" id="slPitch" min="1000" max="2000" value="1500">
                        <span class="val" id="valPitch">1500</span>
                    </div>
                    <div class="slider-row">
                        <label>Yaw</label>
                        <input type="range" id="slYaw" min="1000" max="2000" value="1500">
                        <span class="val" id="valYaw">1500</span>
                    </div>
                    <div class="btn-row">
                        <button class="btn btn-arm" id="btnArm" onclick="armDrone()">ARM</button>
                        <button class="btn btn-disarm" id="btnDisarm" onclick="disarmDrone()">DISARM</button>
                        <button class="btn btn-stop" onclick="stopCommands()">STOP SENDING</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let selectedMac = null;
        let sending = false;
        let sendInterval = null;
        let armed = false;
        let wsAuthRejected = false;  // set when WS closed with 1008 (auth)

        // --- Auth token management ---
        // The server has an OPT-IN auth layer (server.auth_token). When the
        // operator sets a token here, it is attached to mutating REST calls as
        // an Authorization: Bearer header and to the /ws/dashboard URL as a
        // ?token= query param. When no token is set, behaviour is identical to
        // the unauthenticated default (backward compatible).
        const TOKEN_KEY = 'floppi_auth_token';

        function getToken() {
            return localStorage.getItem(TOKEN_KEY) || '';
        }

        function refreshAuthIndicator() {
            const ind = document.getElementById('authIndicator');
            if (getToken()) {
                ind.textContent = 'Token set';
                ind.classList.add('set');
            } else {
                ind.textContent = 'No token';
                ind.classList.remove('set');
            }
        }

        function showAuthBanner(message) {
            const banner = document.getElementById('authBanner');
            banner.textContent = message;
            banner.classList.add('show');
        }

        function hideAuthBanner() {
            document.getElementById('authBanner').classList.remove('show');
        }

        function saveToken() {
            const val = document.getElementById('authTokenInput').value.trim();
            if (val) {
                localStorage.setItem(TOKEN_KEY, val);
            } else {
                localStorage.removeItem(TOKEN_KEY);
            }
            document.getElementById('authTokenInput').value = '';
            refreshAuthIndicator();
            hideAuthBanner();
            wsAuthRejected = false;
            // Reconnect the WebSocket with the new token.
            if (ws) { try { ws.close(); } catch (e) { /* ignore */ } }
            connectWs();
        }

        function clearToken() {
            localStorage.removeItem(TOKEN_KEY);
            document.getElementById('authTokenInput').value = '';
            refreshAuthIndicator();
        }

        // fetch wrapper that attaches the auth header (when a token is set) and
        // surfaces 401s as an auth-required prompt.
        function authedFetch(url, options) {
            options = options || {};
            const token = getToken();
            if (token) {
                options.headers = Object.assign({}, options.headers, {
                    'Authorization': 'Bearer ' + token
                });
            }
            return fetch(url, options).then(resp => {
                if (resp.status === 401) {
                    showAuthBanner('Authentication required: enter a valid auth token (header rejected by server).');
                }
                return resp;
            });
        }

        // --- WebSocket ---
        function connectWs() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const token = getToken();
            const q = token ? ('?token=' + encodeURIComponent(token)) : '';
            ws = new WebSocket(`${proto}//${location.host}/ws/dashboard${q}`);

            ws.onopen = () => {
                document.getElementById('connStatus').textContent = 'Connected';
                wsAuthRejected = false;
                hideAuthBanner();
                // Initial fleet fetch
                fetch('/api/drones').then(r => r.json()).then(renderFleet);
            };

            ws.onmessage = (evt) => {
                const msg = JSON.parse(evt.data);
                if (msg.type === 'telemetry') {
                    updateTelemetry(msg.mac, msg.data);
                    updateFleetCard(msg.mac, true);
                }
            };

            ws.onclose = (evt) => {
                // 1008 = policy violation: the server rejected the handshake for
                // a missing/invalid token or a disallowed Origin.
                if (evt.code === 1008) {
                    wsAuthRejected = true;
                    document.getElementById('connStatus').textContent = 'Auth required';
                    showAuthBanner('WebSocket rejected (auth required / invalid token or disallowed origin). Enter a valid auth token.');
                    return;  // do not auto-reconnect into a 1008 loop
                }
                document.getElementById('connStatus').textContent = 'Disconnected — reconnecting...';
                setTimeout(connectWs, 3000);
            };
        }

        // --- Fleet rendering ---
        // SECURITY (F-10): drone-supplied telemetry is UNTRUSTED. A spoofed,
        // compromised, or MITM'd drone controls fields like `name` and `ip`
        // (`ip` in particular is adopted verbatim from telemetry `net.ip` with
        // no server-side validation). Render every drone-derived string via
        // textContent / DOM nodes — never innerHTML / template-string-into-HTML
        // — so injected markup (`<script>`, `<img onerror=...>`, etc.) can never
        // become live DOM. textContent does not HTML-parse, so unicode/fullwidth
        // angle-bracket tricks are inert too.
        function renderFleet(drones) {
            const list = document.getElementById('fleetList');
            list.replaceChildren();  // clear without an HTML sink
            drones.forEach(d => {
                const card = document.createElement('div');
                card.className = 'drone-card' + (d.mac === selectedMac ? ' selected' : '');
                card.id = 'card-' + String(d.mac).replace(/:/g, '');
                card.onclick = () => selectDrone(d.mac);

                const nameDiv = document.createElement('div');
                nameDiv.className = 'name';
                const indicator = document.createElement('span');
                indicator.className = 'indicator ' + (d.online ? 'online' : 'offline');
                nameDiv.appendChild(indicator);
                // d.name is drone/operator-controlled -> textContent, not HTML.
                nameDiv.appendChild(document.createTextNode(d.name == null ? '' : String(d.name)));

                const metaDiv = document.createElement('div');
                metaDiv.className = 'meta';
                // d.mac and d.ip are drone/telemetry-derived -> textContent.
                const metaText = String(d.mac) + (d.ip ? ' | ' + String(d.ip) : '');
                metaDiv.textContent = metaText;

                card.appendChild(nameDiv);
                card.appendChild(metaDiv);
                list.appendChild(card);
            });
        }

        function updateFleetCard(mac, online) {
            const id = 'card-' + mac.replace(/:/g, '');
            const card = document.getElementById(id);
            if (card) {
                const ind = card.querySelector('.indicator');
                if (ind) { ind.className = 'indicator ' + (online ? 'online' : 'offline'); }
            }
        }

        // --- Drone selection ---
        function selectDrone(mac) {
            selectedMac = mac;
            stopCommands();
            document.getElementById('noSelection').style.display = 'none';
            document.getElementById('droneView').style.display = 'block';

            // Reset sliders
            document.getElementById('slThrottle').value = 1000;
            document.getElementById('slRoll').value = 1500;
            document.getElementById('slPitch').value = 1500;
            document.getElementById('slYaw').value = 1500;
            updateSliderDisplays();

            armed = false;

            // Update selected state in fleet
            document.querySelectorAll('.drone-card').forEach(c => c.classList.remove('selected'));
            const id = 'card-' + mac.replace(/:/g, '');
            const card = document.getElementById(id);
            if (card) card.classList.add('selected');

            // Fetch initial telemetry (read-only endpoint, open even with auth)
            authedFetch(`/api/drones/${encodeURIComponent(mac)}/telemetry`)
                .then(r => r.json())
                .then(data => updateTelemetry(mac, data));
        }

        // --- Telemetry display ---
        function updateTelemetry(mac, data) {
            if (mac !== selectedMac) return;
            if (!data || data.error) return;

            document.getElementById('tRoll').textContent = data.roll ?? '--';
            document.getElementById('tPitch').textContent = data.pitch ?? '--';
            document.getElementById('tYaw').textContent = data.yaw ?? '--';
            document.getElementById('tArmed').textContent = data.armed ? 'YES' : 'NO';
            document.getElementById('tArmed').style.color = data.armed ? '#e94560' : '#4ecca3';
            document.getElementById('tLoop').textContent = data.loop_us ?? '--';

            const net = data.net || {};
            document.getElementById('tRssi').textContent = net.rssi ?? '--';

            const motors = data.motors || {};
            document.getElementById('tMotors').textContent =
                `M1:${motors.m1 ?? '-'} M2:${motors.m2 ?? '-'} M3:${motors.m3 ?? '-'} M4:${motors.m4 ?? '-'}`;
        }

        // --- Slider control ---
        ['Throttle', 'Roll', 'Pitch', 'Yaw'].forEach(name => {
            const slider = document.getElementById('sl' + name);
            slider.oninput = () => {
                document.getElementById('val' + name).textContent = slider.value;
                if (!sending) startSending();
            };
            // Return sticks to center on release (except throttle)
            if (name !== 'Throttle') {
                slider.onmouseup = () => { slider.value = 1500; slider.oninput(); };
                slider.ontouchend = () => { slider.value = 1500; slider.oninput(); };
            }
        });

        function updateSliderDisplays() {
            ['Throttle', 'Roll', 'Pitch', 'Yaw'].forEach(name => {
                document.getElementById('val' + name).textContent =
                    document.getElementById('sl' + name).value;
            });
        }

        // --- Command sending ---
        function startSending() {
            if (sending) return;
            sending = true;
            // Send at ~10Hz while active
            sendInterval = setInterval(sendCurrentChannels, 100);
        }

        function stopCommands() {
            sending = false;
            if (sendInterval) { clearInterval(sendInterval); sendInterval = null; }
        }

        function sendCurrentChannels() {
            if (!ws || ws.readyState !== WebSocket.OPEN || !selectedMac) return;
            ws.send(JSON.stringify({
                type: 'command',
                mac: selectedMac,
                channels: {
                    ch1: parseInt(document.getElementById('slRoll').value),
                    ch2: parseInt(document.getElementById('slPitch').value),
                    ch3: parseInt(document.getElementById('slThrottle').value),
                    ch4: parseInt(document.getElementById('slYaw').value),
                    ch5: armed ? 2000 : 1000,
                    ch6: 1000
                }
            }));
        }

        function armDrone() {
            if (!confirm('ARM the drone? Ensure props are removed!')) return;
            armed = true;
            if (!sending) startSending();
        }

        function disarmDrone() {
            armed = false;
            document.getElementById('slThrottle').value = 1000;
            updateSliderDisplays();
            sendCurrentChannels();
        }

        // --- Periodic fleet refresh ---
        setInterval(() => {
            authedFetch('/api/drones').then(r => r.json()).then(renderFleet).catch(() => {});
        }, 5000);

        // --- Init ---
        refreshAuthIndicator();
        connectWs();
    </script>
</body>
</html>
