# PlatformIO configuration for auto_orientation project
#
# This is a template configuration. Customize for your target board:
# - Arduino Nano: set board = nanoatmega328
# - Arduino Mega: set board = megaatmega2560
# - Teensy 3.2: set board = teensy31
# - ESP32: set board = esp32dev
#
# See: https://docs.platformio.org/en/latest/boards/index.html

[platformio]
default_envs = arduino_mega
src_dir = src
lib_dir = lib
test_dir = tests

# Note: After Mega works, support Nano, Uno, ESP32, Teensy (see docs/roadmap.md)

[env:arduino_nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 115200
monitor_speed = 115200
# Uncomment to enable additional compile flags:
# build_flags = -DDEBUG_OUTPUT

[env:arduino_mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
upload_speed = 115200
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
lib_deps =
    Adafruit Unified Sensor
    Adafruit BusIO

[env:teensy31]
platform = teensy
board = teensy31
framework = arduino
upload_speed = 134217728  # Teensy uses different speed encoding
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
