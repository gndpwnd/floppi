# PlatformIO configuration for auto_orientation
# ============================================================================
#
# Active balance-robot envs (post 2026-05-19 platform bifurcation):
#   mega_balance         Arduino Mega (256K flash) — universal/adaptive stack,
#                        the primary build; new code lands here by default
#   arduino_uno_minimal  Arduino Uno  (32K flash)  — lean flight build,
#                        hardcoded PID, Python-tuned constants
#   arduino_uno_tuning   Arduino Uno  (32K flash)  — guided P->I->D tuning bench
#
# Legacy / scaffolded:
#   uno_balance          LEGACY/DEAD — old universal-stack-on-Uno path
#                        (~93.6% flash). Superseded by the arduino_uno_* envs.
#                        Kept for history; do not extend or build by default.
#   esp32_balance        Scaffolded (commented out) — future WiFi/dashboard port
#   teensy_balance       Scaffolded (commented out) — future FPU/high-rate port
#
# Each balance env defaults to USE_BNO055 (matches the reference .ino).
# Override the IMU at build time via project_option, e.g.:
#   pio run -e mega_balance --project-option="build_flags=-D USE_BNO085 -U USE_BNO055"
#
# Orientation-framework envs (Phase 3 reference — BNO085 + GPS + EKF):
#   mega_orientation              Production
#   mega_orientation_calibration  Verbose serial
#
# Native unit tests:
#   native_test       runs on the dev machine via `pio test -e native_test`

[platformio]
# Primary build: mega_balance (the actively-developed universal/adaptive env).
# Retargeted off the legacy `uno_balance` env, which sat at ~93.6% Uno flash.
#
# ----------------------------------------------------------------------------
# Uno onboarding flow (read me before `pio run` on an Uno)
# ----------------------------------------------------------------------------
# Mega users:
#   `mega_balance` (the current default — keep it). Single-flash workflow.
#
# Uno users — TWO-STEP onboarding, do NOT skip step 1:
#   1) FIRST flash `arduino_uno_tuning` (guided cal + PID tune over serial):
#        pio run -e arduino_uno_tuning -t upload
#        # then over the serial console (115200 baud):
#        #   'c' -> guided BNO055 calibration walk-through (saves to EEPROM)
#        #   't' -> guided P->I->D tuning session     (also saves to EEPROM)
#   2) THEN flash `arduino_uno_minimal` to fly:
#        pio run -e arduino_uno_minimal -t upload
#      The flight build reads the EEPROM cal + tune block at boot. Skipping
#      step 1 leaves the chip with seed gains + an uncalibrated IMU; the
#      flight build will refuse to arm in that case (use 'F' to override).
#
# default_envs intentionally stays on mega_balance — Uno users pass `-e ...`.
default_envs = mega_balance
src_dir = src
lib_dir = lib
test_dir = tests

# ============================================================================
# Shared bases (extended by board envs — never built directly)
# ============================================================================

[base]
framework = arduino
lib_deps =
    Adafruit Unified Sensor
    Adafruit BusIO

# Balance robot — shared build flags + IMU library
#
# USE_BALANCE_HELD_DETECTION   ON  → motors stop when bot is handled, resume on
#                                    quiet+level in 200 ms (lenient)
# USE_BALANCE_FALL_DETECTION   OFF → no sticky FALLEN; PID keeps running
#                                    (default per universal balance vision)
# USE_BALANCE_AUTO_BOOTSTRAP   ON  → prop-and-go: boot fires BOOTSTRAP if a
#                                    mount offset is saved and pitch is within
#                                    ±5° of it. Undefine to require manual 'b'
#                                    so operator can position the bot in the
#                                    safe test area before motors engage.
[base_balance]
extends = base
build_flags =
    -D USE_BALANCING_ROBOT
    -D USE_BNO055
    -D USE_BALANCE_HELD_DETECTION
    -D USE_BALANCE_AUTO_BOOTSTRAP
lib_deps =
    ${base.lib_deps}
    Adafruit BNO055

# Sources excluded from balance builds (legacy BNO085/GPS/EKF/snapshot — these
# live in /sensors, /navigation, /features, /file_system but are not used by
# the balance application). Removing them at compile time keeps Uno under
# 32 KB; on Mega/ESP32/Teensy it just speeds up the build.
[balance_src_filter]
# Storage backends self-guard via #ifdef ARDUINO_ARCH_* so all variants can
# coexist in the build — only the matching one emits code.
build_src_filter =
    +<*>
    -<applications/balancing_robot_uno/>
    -<features/>
    -<file_system/>
    -<output/>
    -<navigation/ekf.cpp>
    -<navigation/state_dynamics.cpp>
    -<navigation/measurement_model.cpp>
    -<navigation/covariance_manager.cpp>
    -<navigation/coordinate_frame.cpp>
    -<sensors/bno085.cpp>
    -<sensors/bno085_calibration.cpp>
    -<sensors/gps.cpp>
    -<math/coordinates.cpp>
    -<math/magnetic_declination.cpp>
    -<storage/persistent_storage_native.cpp>
    -<control/tuners/relay_feedback.cpp>
    # NOTE (FIN-05 / 2026-06-21): excluding `src/control/auto_pid_tuner.cpp`
    # from this filter was attempted and rejected. The mega_balance build's
    # `main.cpp` still constructs `static AutoPIDTuner tuner(noop_strategy);`
    # to satisfy BalanceApp's constructor signature, which native_test
    # fixtures (test_balance_app_*.cpp etc.) also depend on. Excluding the
    # .cpp produces an unresolved-symbol link error for AutoPIDTuner::
    # AutoPIDTuner(ITuningStrategy&). The clean path is to drop the
    # AutoPIDTuner& parameter from BalanceApp, but that requires editing the
    # native-test fixtures (out of FIN-05's write zone). The dead-code
    # excision part of FIN-05 instead removed the AUTO_TUNE enum value,
    # switch handlers, and BalanceAppConfig tune_* fields — the .cpp stays
    # in the build but contributes nothing reachable.

# ============================================================================
# BALANCE ROBOT ENVS
# ============================================================================

# LEGACY/DEAD — the old universal-stack-on-Uno path (~93.6% flash, overflow
# risk). Superseded by `arduino_uno_minimal` / `arduino_uno_tuning` after the
# 2026-05-19 platform bifurcation. Kept so platformio.ini history stays
# readable; not the default env and should not be extended. See docs/scope.md.
[env:uno_balance]
extends = base_balance, balance_src_filter
platform = atmelavr
board = uno
# BNO055_NO_EXT_CRYSTAL — generic BNO055 modules (no crystal). Adafruit
# breakout has a crystal; comment this out if you swap to one.
# MsTimer2 — drives the 5 ms PID ISR. Chosen over TimerOne because Timer1
# owns PWM pins 9 & 10 (ENB=10 in the L298N pinout).
build_flags = ${base_balance.build_flags} -D BNO055_NO_EXT_CRYSTAL
lib_deps =
    ${base_balance.lib_deps}
    paulstoffregen/MsTimer2 @ ^1.1

[env:mega_balance]
extends = base_balance, balance_src_filter
platform = atmelavr
board = megaatmega2560
# Mega has TimerOne (pin 11 + 12 PWM). We still use MsTimer2 for consistency
# with the Uno target — the bench Uno bot may move to a Mega for headroom.
#
# USE_WHEEL_ENCODERS enables the wheel-encoder driver (src/sensors/wheel_encoder).
# Phase 4M.10 — hall-effect quadrature encoders on Mega INT pins 18/19 (left)
# and 2/3 (right). PJRC Encoder library handles the ISR-side decoding.
# Mega only — Uno has just 2 INT pins (insufficient for two wheels). See
# docs/findings/research_wheel_encoders_mega_2026-05-19.md.
build_flags = ${base_balance.build_flags} -D USE_WHEEL_ENCODERS
lib_deps =
    ${base_balance.lib_deps}
    paulstoffregen/MsTimer2 @ ^1.1
    paulstoffregen/Encoder @ ^1.4.4

# ============================================================================
# MINIMAL UNO BALANCE ENVS (Phase strategic-pivot — 2026-05-19)
# ============================================================================
#
# Shared base for the lean Uno balance builds (`arduino_uno_minimal` and
# `arduino_uno_tuning`). Both target the Uno, default to BNO055, and compile
# only the minimal app + BNO055 driver + L298N driver + PID controller + math
# helpers — everything from the universal balance stack is excluded. The two
# envs differ ONLY by the extra -D UNO_GUIDED_TUNING flag (see below). This
# section is a base — never built directly.
#
# IMU SELECTION (-DUSE_BNO055 / -DUSE_BNO085, compile-time):
#   The default below is -DUSE_BNO055 — matches the reference SelfBalancing
#   Robot3.ino. To swap to BNO085, override in build_flags. Example for a
#   Mega/Teensy/ESP32 variant env (you would NOT extend uno_minimal_base from
#   a non-Uno platform; this is illustrative):
#     build_flags = -DUSE_BNO085   # NO -DUSE_BNO055 here
#   Trying USE_BNO085 on Uno hits an explicit #error in main.cpp because the
#   Adafruit_BNO08x + SH-2 library (~15-20 KB flash) overflows the 32 KB Uno.
#   The selection mechanism is architectural — a Mega/Teensy/ESP32 port would
#   reuse this same `applications/balancing_robot_uno/` source tree.
#   See main.cpp top-of-file comment for the full rationale.
[uno_minimal_base]
extends = base
platform = atmelavr
board = uno
build_flags =
    -D USE_BNO055
    -D BNO055_NO_EXT_CRYSTAL
lib_deps =
    ${base.lib_deps}
    Adafruit BNO055
    paulstoffregen/MsTimer2 @ ^1.1
build_src_filter =
    +<applications/balancing_robot_uno/>
    +<sensors/bno055.cpp>
    +<actuators/l298n_motor_driver.cpp>
    +<control/pid_controller.cpp>
    +<math/quaternion_conversions.cpp>
    +<math/quaternion.cpp>

# `arduino_uno_minimal` builds a stripped-down balance program that mirrors
# docs/archive/balancing_robot_reference/SelfBallancingRobot3.ino in spirit:
# hardcoded Kp/Ki/Kd from balance_constants.h, no auto-tune, no BOOTSTRAP, no
# online mounting estimator, no plant identifier. The Python brute-force
# tuner (tools/sim/brute_tune.py) generates balance_constants.h between
# flashes. Targets <50% Uno flash so the iteration loop is fast.
[env:arduino_uno_minimal]
extends = uno_minimal_base
description = Minimal Uno balance bot — hardcoded PID, Python-tuned constants

# ============================================================================
# GUIDED TUNING UNO ENV (Phase UT — 2026-05-20)
# ============================================================================
#
# `arduino_uno_tuning` builds the `arduino_uno_minimal` program PLUS the
# interactive TuningSession state machine (tuning_session.cpp) over the serial
# CLI. -D UNO_GUIDED_TUNING gates ALL of that code so the flight build carries
# none of it. The bot stays live and balancing while the operator walks P->I->D
# one stage at a time; the result persists to EEPROM via tune_storage.
#
# Inherits board / IMU / src filter from [uno_minimal_base]; tuning_session.cpp
# and tune_storage.cpp are picked up by the +<applications/balancing_robot_uno/>
# glob. dtostrf is acceptable in this build for readable Kp=48.0 output.
[env:arduino_uno_tuning]
extends = uno_minimal_base
build_flags =
    ${uno_minimal_base.build_flags}
    -D UNO_GUIDED_TUNING
description = Uno guided PID tuning bench build

# ----------------------------------------------------------------------------
# esp32_balance and teensy_balance — DEFINED BUT NOT YET FUNCTIONAL.
#
# These envs are scaffolded so the IDE/CI can see the build matrix, but the
# 5 ms PID tick currently uses MsTimer2 (AVR-only). Porting work needed:
#   - ESP32: replace MsTimer2 with esp_timer or hw_timer, port pgm_read_byte
#   - Teensy: replace MsTimer2 with IntervalTimer
# Both also need persistent_storage backend exercised end-to-end with the
# balance-bot EEPROM layouts (0x000 cal blob, 0x200 mount, 0x210 actuator).
# Tracking: docs/todo.md / docs/roadmap.md.
#
# To enable a port, uncomment the env and complete the platform-conditional
# include of the right hardware-timer driver in src/main.cpp.
# ----------------------------------------------------------------------------
# [env:esp32_balance]
# extends = base_balance, balance_src_filter
# platform = espressif32
# board = esp32dev
# build_flags = ${base_balance.build_flags} -D USE_ESP32 -D USE_WIFI

# [env:teensy_balance]
# extends = base_balance, balance_src_filter
# platform = teensy
# board = teensy40
# build_flags = ${base_balance.build_flags} -D USE_TEENSY

# ============================================================================
# ORIENTATION-FRAMEWORK ENVS (BNO085 + GPS + EKF — Phase 3)
# ============================================================================

[env:mega_orientation]
extends = base
platform = atmelavr
board = megaatmega2560
# USE_EKF=0 — the 16-state EKF is currently a stub on this env: gyro/accel
# inputs are hardcoded placeholders (main.cpp ~782) and the GPS->EKF update
# step is a TODO (main.cpp ~851). The four 16x16 covariance matrices cost
# ~4 KB of SRAM on a Mega that only has 8 KB. Gating EKF off makes the env
# actually fit in RAM (was 125% before). Re-enable (-D USE_EKF=1) once the
# BNO085 raw gyro/accel are plumbed through and the GPS update is wired.
# See docs/findings/mega_orientation_ram_overflow_diagnosis_2026-05-19.md.
build_flags = -D USE_IMU_GPS_TELEMETRY -D USE_EKF=0
lib_deps = ${base.lib_deps}
    SD
# Exclude the minimal Uno balance app (AVR/MsTimer2-only, defines its own
# setup/loop — would collide with src/main.cpp at link time).
# Also exclude ekf.cpp when USE_EKF=0 — saves ~4 KB SRAM and ~6 KB flash.
build_src_filter =
    +<*>
    -<applications/balancing_robot_uno/>
    -<navigation/ekf.cpp>

[env:mega_orientation_calibration]
extends = env:mega_orientation
build_flags = ${env:mega_orientation.build_flags} -D CALIBRATION_MODE
description = Orientation framework, verbose calibration mode

# ============================================================================
# NATIVE UNIT TESTS
# ============================================================================

[env:native_test]
platform = native
test_framework = unity
build_flags =
    -std=c++11
    -Wall
    -Wextra
    -DNATIVE_TEST
build_src_filter =
    +<*>
    -<main.cpp>
    -<actuators/l298n_motor_driver.cpp>
    -<applications/balancing_robot_uno/>
    -<file_system/>
    -<navigation/covariance_manager.cpp>
    -<navigation/ekf.cpp>
    -<sensors/bno085.cpp>
    -<sensors/bno085_calibration.cpp>
    -<storage/persistent_storage_avr.cpp>
    -<storage/persistent_storage_esp32.cpp>
    -<storage/persistent_storage_teensy.cpp>
description = Native unit tests (pio test -e native_test)
