# PlatformIO configuration for auto_orientation project
#
# This is a template configuration. Customize for your target board:
# - Arduino Nano: set board = nanoatmega328
# - Arduino Mega: set board = megaatmega2560
# - Teensy 3.2: set board = teensy31
# - ESP32: set board = esp32dev
#
# See: https://docs.platformio.org/en/latest/boards/index.html

[platformio]
default_envs = arduino_mega
src_dir = src
lib_dir = lib
test_dir = tests

# Note: After Mega works, support Nano, Uno, ESP32, Teensy (see docs/roadmap.md)

[env:arduino_nano]
platform = atmelavr
board = nanoatmega328
framework = arduino

[env:arduino_mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =
    Adafruit Unified Sensor
    Adafruit BusIO

[env:arduino_mega_calibration]
extends = env:arduino_mega
build_flags = -D CALIBRATION_MODE
description = Calibration mode with detailed serial output

[env:arduino_mega_production]
extends = env:arduino_mega
build_flags =
description = Production mode with minimal output, optimized for deployment

[env:arduino_mega_debug]
extends = env:arduino_mega
build_flags = -D DEBUG_MODE

[env:arduino_mega_snapshot]
extends = env:arduino_mega
build_flags = -D CALIBRATION_MODE -D SNAPSHOT_MODE
description = Calibration mode with snapshot recording to SD card
lib_deps =
    Adafruit Unified Sensor
    Adafruit BusIO
    SD

[env:arduino_mega_snapshot_only]
extends = env:arduino_mega
build_flags = -D SNAPSHOT_MODE
description = Production mode with snapshot recording to SD card only
lib_deps =
    Adafruit Unified Sensor
    Adafruit BusIO
    SD

[env:teensy31]
platform = teensy
board = teensy31
framework = arduino

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
