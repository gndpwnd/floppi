# PlatformIO configuration for auto_orientation project
#
# This is a template configuration. Customize for your target board:
# - Arduino Nano: set board = nanoatmega328
# - Arduino Mega: set board = megaatmega2560
# - Teensy 3.2: set board = teensy31
# - ESP32: set board = esp32dev
#
# See: https://docs.platformio.org/en/latest/boards/index.html

[platformio]
default_envs = arduino_mega
src_dir = src
lib_dir = lib
test_dir = tests

# Note: After Mega works, support Nano, Uno, ESP32, Teensy (see docs/roadmap.md)

[env:arduino_nano]
platform = atmelavr
board = nanoatmega328
framework = arduino

[env:arduino_mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =
    Adafruit Unified Sensor
    Adafruit BusIO
    SD

[env:arduino_mega_calibration]
extends = env:arduino_mega
build_flags = -D CALIBRATION_MODE
description = Calibration mode with detailed serial output

[env:arduino_mega_production]
extends = env:arduino_mega
build_flags =
description = Production mode with minimal output, optimized for deployment

[env:arduino_mega_debug]
extends = env:arduino_mega
build_flags = -D DEBUG_MODE

[env:arduino_mega_snapshot]
extends = env:arduino_mega
build_flags = -D CALIBRATION_MODE -D SNAPSHOT_MODE
description = Calibration mode with snapshot recording to SD card
lib_deps =
    Adafruit Unified Sensor
    Adafruit BusIO
    SD

[env:arduino_mega_snapshot_only]
extends = env:arduino_mega
build_flags = -D SNAPSHOT_MODE
description = Production mode with snapshot recording to SD card only
lib_deps =
    Adafruit Unified Sensor
    Adafruit BusIO
    SD

[env:arduino_mega_gps]
extends = env:arduino_mega
build_flags = -D GPS_ENABLE -D GPS_UART_PORT=0 -D GPS_BAUD=9600
description = Production mode with GPS support at 9600 baud

[env:arduino_mega_gps_115200]
extends = env:arduino_mega
build_flags = -D GPS_ENABLE -D GPS_UART_PORT=0 -D GPS_BAUD=115200
description = Production mode with GPS support at 115200 baud (for M9N/M10S variants)

[env:arduino_mega_full]
extends = env:arduino_mega
build_flags = -D CALIBRATION_MODE -D GPS_ENABLE -D SNAPSHOT_MODE -D GPS_UART_PORT=0 -D GPS_BAUD=9600
description = Full debug mode with all features: calibration + GPS + snapshot recording
lib_deps =
    Adafruit Unified Sensor
    Adafruit BusIO
    SD

[env:teensy31]
platform = teensy
board = teensy31
framework = arduino

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

# ============================================================================
# Phase 4+ envs (added 2026-05-12)
# ============================================================================

# --- Alternative IMU drivers ---

[env:arduino_mega_bno055]
extends = env:arduino_mega
build_flags = -D USE_BNO055
description = Mega + BNO055 (alternative to BNO085) — Phase 4.6
lib_deps =
    ${env:arduino_mega.lib_deps}
    Adafruit BNO055

[env:arduino_mega_bno055_calibration]
extends = env:arduino_mega_bno055
build_flags = -D USE_BNO055 -D CALIBRATION_MODE
description = BNO055 + verbose calibration mode

# --- Application: self-balancing robot ---

[env:arduino_mega_balancing]
extends = env:arduino_mega_bno055
build_flags = -D USE_BNO055 -D USE_BALANCING_ROBOT -D USE_TUNER_RELAY
description = Self-balancing robot reference app (BNO055 + L298N + relay-feedback auto-tune) — Phase 4.7
lib_deps = ${env:arduino_mega_bno055.lib_deps}

[env:arduino_mega_balancing_calibration]
extends = env:arduino_mega_balancing
build_flags = -D USE_BNO055 -D USE_BALANCING_ROBOT -D USE_TUNER_RELAY -D CALIBRATION_MODE
description = Self-balancing robot in calibration mode (verbose serial)

# --- Self-balancing robot on Arduino Uno (tight: 32K flash / 2K RAM) ---
# build_src_filter excludes the legacy BNO085/GPS/EKF/snapshot subsystems —
# main.cpp's #ifdef USE_BALANCING_ROBOT already skips them functionally, but
# on Uno we also can't afford the flash to compile them at all.
[env:arduino_uno_balancing]
platform = atmelavr
board = uno
framework = arduino
# Default behaviour:
#   USE_BALANCE_HELD_DETECTION  ON  → motors stop when bot is handled / lifted,
#                                     resume on quiet+level in 200 ms (lenient)
#   USE_BALANCE_FALL_DETECTION  OFF → no FALLEN state; PID keeps running
# HELD re-enabled 2026-05-12 evening after "robot overreacts when picked up"
# feedback. Lenient resume keeps reposition workflow snappy.
build_flags = -D USE_BNO055 -D USE_BALANCING_ROBOT -D USE_TUNER_RELAY -D USE_BALANCE_HELD_DETECTION
description = Self-balancing robot on Arduino Uno + BNO055 + L298N — Phase 4.7 (Uno target)
# MsTimer2 (paulstoffregen) drives the 5 ms PID ISR (Item 3, see
# research_osoyoo_reference_implementation.md §3 / §9). MsTimer2 is chosen
# over TimerOne because Timer1 owns PWM pins 9 & 10 on the ATmega328P; the
# L298N pin map uses ENB=10 for motor B PWM, so claiming Timer1 would break
# half the motor driver. Timer2 conflicts only with pins 3 & 11 (unused here).
lib_deps =
    Adafruit Unified Sensor
    Adafruit BusIO
    Adafruit BNO055
    paulstoffregen/MsTimer2 @ ^1.1
build_src_filter =
    +<*>
    -<features/>
    -<file_system/>
    -<output/>
    -<navigation/ekf.cpp>
    -<navigation/state_dynamics.cpp>
    -<navigation/measurement_model.cpp>
    -<navigation/covariance_manager.cpp>
    -<navigation/coordinate_frame.cpp>
    -<sensors/bno085.cpp>
    -<sensors/bno085_calibration.cpp>
    -<sensors/gps.cpp>
    -<math/coordinates.cpp>
    -<math/magnetic_declination.cpp>
    -<storage/persistent_storage_esp32.cpp>
    -<storage/persistent_storage_teensy.cpp>
    -<storage/persistent_storage_native.cpp>

# --- Native host test env (Unity-based unit tests on the dev machine) ---

[env:native_test]
platform = native
test_framework = unity
build_flags =
    -std=c++11
    -Wall
    -Wextra
    -DNATIVE_TEST
build_src_filter =
    +<*>
    -<storage/persistent_storage_avr.cpp>
    -<storage/persistent_storage_esp32.cpp>
    -<storage/persistent_storage_teensy.cpp>
description = Native unit tests (pio test --environment=native_test)
